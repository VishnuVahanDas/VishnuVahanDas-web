# Temporary HTTP-only config, used by setup.sh only until the TLS certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name vishnuvahan.com www.vishnuvahan.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    root /var/www/vishnuvahan.com/current;
    index index.html;
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
