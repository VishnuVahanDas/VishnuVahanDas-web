# vishnuvahan.com: static Astro site. Installed by deploy/server/setup.sh.
# A NEW server block only; it never touches the other sites on this VPS.
# Lines between BEGIN-WWW / END-WWW are removed by setup.sh if www is not in DNS.

server {
    listen 80;
    listen [::]:80;
    server_name vishnuvahan.com www.vishnuvahan.com;

    # Let's Encrypt renewals (certbot --webroot) answer here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://vishnuvahan.com$request_uri;
    }
}

# BEGIN-WWW
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vishnuvahan.com;
    ssl_certificate     /etc/letsencrypt/live/vishnuvahan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vishnuvahan.com/privkey.pem;
    return 301 https://vishnuvahan.com$request_uri;
}
# END-WWW

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vishnuvahan.com;

    ssl_certificate     /etc/letsencrypt/live/vishnuvahan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vishnuvahan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:vvSSL:10m;
    ssl_session_timeout 1d;

    # `current` → the newest build in releases/ (see /usr/local/bin/vv-deploy).
    root /var/www/vishnuvahan.com/current;
    index index.html;
    error_page 404 /404.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/rss+xml application/json text/plain;
    gzip_min_length 1024;

    # Hashed build files never change: cache for a year.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/vishnuvahan-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images, fonts, video, PDF: a week.
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?|mp4|webm|pdf)$ {
        include /etc/nginx/snippets/vishnuvahan-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Pages: always revalidate, so a new deploy shows immediately.
    location / {
        include /etc/nginx/snippets/vishnuvahan-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # Phase 6 (later): the small Django API behind gunicorn.
    # location /api/ {
    #     proxy_pass http://unix:/run/vishnuvahan-api.sock;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
